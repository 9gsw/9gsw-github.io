<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9gsw.1 | القناة الرسمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#181915',
                            card: '#222520',
                            green: '#2c5e4f',
                            lightgreen: '#3e7d6b',
                            cream: '#e6c896',
                            hair: '#4a3728'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #121310; color: #f3f4f6; }
        .cream-gradient-text { background: linear-gradient(135deg, #fcead0 0%, #e6c896 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-gradient-bg { background: linear-gradient(135deg, #2c5e4f 0%, #1e4237 100%); }
        .accent-gradient-bg { background: linear-gradient(135deg, #e6c896 0%, #c49d60 100%); }
        .card-glow:hover { box-shadow: 0 0 25px rgba(230, 200, 150, 0.2); border-color: rgba(230, 200, 150, 0.4); }
    </style>
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen flex flex-col justify-between selection:bg-brand-cream selection:text-brand-dark">

    <nav class="fixed top-0 left-0 w-full bg-brand-dark/90 backdrop-blur-md z-50 border-b border-gray-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-11 h-11 rounded-xl p-0.5 accent-gradient-bg shadow-md">
                        <img id="logo-img" src="img"شعار 9gsw.1" class="w-full h-full rounded-[10px] object-cover">
                    </div>
                    <span class="text-xl font-black tracking-wide text-white">9gsw<span class="cream-gradient-text">.1</span></span>
                </div>

                <div class="hidden md:flex items-center space-x-8 space-x-reverse text-sm font-semibold">
                    <a href="#home" class="hover:text-brand-cream transition-colors">الرئيسية</a>
                    <a href="#about" class="hover:text-brand-cream transition-colors">عن القناة</a>
                    <a href="#videos" class="hover:text-brand-cream transition-colors">الفيديوهات</a>
                    <a href="#contact" class="hover:text-brand-cream transition-colors">التواصل والأعمال</a>
                </div>

                <div class="hidden md:block">
                    <a href="https://youtube.com/@9gsw.1?si=CQqjYhO_rdqPuMtF" target="_blank" rel="noopener noreferrer" class="accent-gradient-bg text-brand-dark font-black px-6 py-2.5 rounded-full hover:opacity-90 transition-all transform hover:scale-105 inline-flex items-center space-x-2 space-x-reverse shadow-lg shadow-brand-cream/10">
                        <i class="fa-brands fa-youtube text-lg"></i>
                        <span>اشترك الآن</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section id="home" class="pt-32 pb-20 relative overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid md:grid-cols-2 gap-12 items-center">
                <div class="text-center md:text-right space-y-6">
                    <h1 class="text-4xl sm:text-5xl font-black">أهلاً بك في عالم <span class="cream-gradient-text">9gsw.1</span></h1>
                    <p class="text-gray-400">صانع محتوى على يوتيوب، أشارككم لقطات مضحكة عن محتوى المحقق كونان .</p>
                </div>
                <div class="flex justify-center">
                    <img src="img" class="w-72 h-72 rounded-3xl border-2 border-brand-cream/30 object-cover shadow-2xl">
                </div>
            </div>
        </div>
    </section>

    <section id="videos" class="py-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 class="text-3xl font-black text-white mb-8">أحدث <span class="cream-gradient-text">الفيديوهات</span></h2>
            <div id="videos-container" class="grid md:grid-cols-3 gap-8"></div>
        </div>
    </section>

    <script>
        const YOUTUBE_API_KEY = "AIzaSyChilk8NpORgWIgOiavIQdZ8uECj9unKdk";
        const CHANNEL_ID = "UCiBIjzAyXhLLKL_gQa95idA"; 

        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById('videos-container');
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${YOUTUBE_API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=6&type=video`);
                const data = await res.json();
                if (data.items && data.items.length) {
                    container.innerHTML = data.items.map(item => `
                        <div class="bg-brand-card border border-gray-800 rounded-2xl overflow-hidden card-glow">
                            <img src="${item.snippet.thumbnails.high.url}" class="w-full aspect-video object-cover">
                            <div class="p-5 space-y-3">
                                <h3 class="font-bold text-white line-clamp-2">${item.snippet.title}</h3>
                                <a href="https://www.youtube.com/watch?v=${item.id.videoId}" target="_blank" class="inline-block bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-full">تشغيل على YouTube</a>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
